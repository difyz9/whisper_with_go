version: '3.8'

services:
  # GPU 版本（需要 NVIDIA Docker 支持）
  whisper-api-gpu:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    image: whisper-api-gpu:latest
    container_name: whisper-api-gpu
    ports:
      - "8080:8080"
    volumes:
      - ./models:/app/models:ro
      - ./uploads:/app/uploads
      - ./outputs:/app/outputs
    environment:
      - SERVER_PORT=8080
      - GIN_MODE=release
      - WHISPER_MODEL_PATH=/app/models/ggml-base.bin
      - WHISPER_THREADS=8
      - MAX_FILE_SIZE=104857600
      - UPLOAD_DIR=/app/uploads
      - OUTPUT_DIR=/app/outputs
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - whisper-network

networks:
  whisper-network:
    driver: bridge
