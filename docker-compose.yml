version: '3.8'

services:
  whisper-api:
    image: ${WHISPER_BASE_IMAGE:-difyz9/whisper-go-base:latest}
    container_name: whisper-api
    working_dir: /workspace
    command: bash -lc "go mod download && go run cmd/server/main.go"
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - .:/workspace
      - ./models:/workspace/models
      - ./uploads:/workspace/uploads
      - ./outputs:/workspace/outputs
      - whisper-go-mod:/go/pkg/mod
      - whisper-go-cache:/root/.cache/go-build
    environment:
      - SERVER_PORT=${SERVER_PORT:-8080}
      - GIN_MODE=${GIN_MODE:-release}
      - WHISPER_MODEL_PATH=${WHISPER_MODEL_PATH:-models/ggml-base.bin}
      - WHISPER_THREADS=${WHISPER_THREADS:-4}
      - MAX_FILE_SIZE=${MAX_FILE_SIZE:-104857600}
      - UPLOAD_DIR=${UPLOAD_DIR:-uploads}
      - OUTPUT_DIR=${OUTPUT_DIR:-outputs}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  whisper-go-mod:
  whisper-go-cache:
