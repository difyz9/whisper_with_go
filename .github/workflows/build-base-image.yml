name: build-whisper-base-image

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile.base
      - docker-compose.base.yml
      - .github/workflows/build-base-image.yml
      - README.md
      - docker/README.md
  workflow_dispatch:
    inputs:
      image_name:
        description: Override image name after ghcr.io/ (for example owner/whisper-go-base)
        required: false
        type: string
        default: ''
      platforms:
        description: Comma separated platforms
        required: false
        type: string
        default: linux/amd64,linux/arm64
      push_latest:
        description: Also publish the latest tag
        required: false
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/whisper-go-base

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    env:
      DEFAULT_PLATFORMS: linux/amd64,linux/arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image name
        id: image
        shell: bash
        run: |
          if [ -n "${{ inputs.image_name }}" ]; then
            echo "value=${{ inputs.image_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ env.IMAGE_NAME }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set platforms
        id: platforms
        shell: bash
        run: |
          if [ -n "${{ inputs.platforms }}" ]; then
            echo "value=${{ inputs.platforms }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ env.DEFAULT_PLATFORMS }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.value }}
          tags: |
            type=sha
            type=raw,value=base
            type=raw,value=latest,enable=${{ github.event_name == 'push' || inputs.push_latest }}

      - name: Build and push base image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.base
          push: true
          platforms: ${{ steps.platforms.outputs.value }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max